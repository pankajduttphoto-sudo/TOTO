plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mariotv.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.mariotv.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
